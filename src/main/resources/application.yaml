# 公共配置（提交到 Git）。数据库表请在 MySQL 中按 md文档/数据库.md 手工执行建表语句。
# 本地/生产敏感项放在 application-dev.yaml、application-prod.yaml（已被 .gitignore）或 .env 中。

spring:
  application:
    name: ai-planner

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    # Jackson 3：日期是否写成时间戳由 datatype 节点配置（不再使用 serialization.write-dates-as-timestamps）
    datatype:
      datetime:
        write-dates-as-timestamps: false

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aigp}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # 与 Jackson、JDBC serverTimezone、定时任务 zone 一致；MySQL DATETIME 落库即北京时间（Asia/Shanghai）
          time_zone: Asia/Shanghai

  flyway:
    enabled: false

  # 可选：配置后，向「含 @ 的邮箱账号」发注册/找回密码验证码邮件（QQ 见 application-dev.yaml.example、md文档/QQ邮箱SMTP与验证码.md）
  mail:
    host: smtp.qq.com
    port: 465
    username: 3817473890@qq.com
    password: nsrgagvtjevicfid
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# 用户主键 users.id 建议从 100000000 起：新建库见 md文档/数据库.md 建表语句；已有库执行 scripts/mysql-users-autoincrement.sql
server:
  port: ${PORT:8000}

# SpringDoc：Swagger UI 与 OpenAPI JSON（标题等在 OpenApiConfig 中配置）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    # 语音转写接口：展开后显示浏览器录音测试面板
    customJs: /swagger-speech-recorder.js

app:
  upload-path: ${APP_UPLOAD_PATH:uploads}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8000}
  max-image-upload-bytes: ${APP_MAX_IMAGE_UPLOAD_BYTES:5242880}
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  jwt:
    # 默认无密钥：dev 见 application-dev.yaml / .env；prod 见 application-prod.yaml（仅环境变量）
    secret-key: ${JWT_SECRET_KEY:}
    access-token-expire-minutes: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:1440}
    refresh-token-expire-days: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:30}
  auth:
    # 验证码有效秒数（注册、找回密码共用）
    verification-ttl-seconds: ${APP_AUTH_VERIFICATION_TTL_SECONDS:300}
    # 仅开发联调：发码接口是否在 JSON 中回显验证码（生产务必 false）
    verification-debug-return-code: ${APP_AUTH_VERIFICATION_DEBUG_RETURN_CODE:false}
  admin:
    bootstrap:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:}
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${LLM_MODEL:qwen3.5-flash}
  vlm:
    api-key: ${VLM_API_KEY:}
    base-url: ${VLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${VLM_MODEL:qwen-vl-max-latest}
  # AI 对话（OpenAI 兼容）：默认 mimo，可切换 ollama；任务 CRUD 由后端工具实现
  chat:
    default-provider: ${AI_CHAT_DEFAULT_PROVIDER:mimo}
    max-history-messages: ${AI_CHAT_MAX_HISTORY:24}
    max-tool-rounds: ${AI_CHAT_MAX_TOOL_ROUNDS:5}
    multi-phase-enabled: ${AI_CHAT_MULTI_PHASE_ENABLED:true}
    fast-path-enabled: ${AI_CHAT_FAST_PATH_ENABLED:true}
    # 默认 false：跳过 intent LLM（仅 plan_proposal 仍走）；true 恢复全量意图分析
    intent-analysis-enabled: ${AI_CHAT_INTENT_ANALYSIS_ENABLED:false}
    planning-history-snippet-messages: ${AI_CHAT_PLANNING_HISTORY_SNIPPET:6}
    push-on-reply-enabled: ${AI_CHAT_PUSH_ON_REPLY:true}
    # 保存 PUT /users/me/llm/settings 时探测 apiKey/baseUrl/model 是否可用
    validate-llm-settings-on-save: ${AI_CHAT_VALIDATE_LLM_SETTINGS_ON_SAVE:true}
    # 为 true 时将中间过程追加写入 txt（仅调试，生产务必 false）
    pipeline-debug-log-enabled: ${AI_CHAT_PIPELINE_DEBUG_LOG:false}
    pipeline-debug-log-file: ${AI_CHAT_PIPELINE_DEBUG_LOG_FILE:logs/ai-chat-pipeline.txt}
    providers:
      mimo:
        # Token Plan 请用 OpenAI 兼容地址 /v1（不要用 /anthropic）；Key 建议环境变量 MIMO_API_KEY
        api-key: ${MIMO_API_KEY:tp-c86l7wklhw8r1vb3nrax1drdijyeyznojsxugglxkhukc41e}
        base-url: ${MIMO_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
        model: ${MIMO_MODEL:mimo-v2.5-pro}
      ollama:
        api-key: ${OLLAMA_API_KEY:}
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
        model: ${OLLAMA_MODEL:qwen2.5}
  # 助手任务到期提醒：站内「任务提醒」会话 + 通知 + WebSocket（不发任务邮件）
  task-reminder:
    enabled: ${APP_TASK_REMINDER_ENABLED:true}
    in-app-enabled: ${APP_TASK_REMINDER_IN_APP:true}
    push-enabled: ${APP_TASK_REMINDER_PUSH:true}
    cron: ${APP_TASK_REMINDER_CRON:0/30 * * * * ?}
    zone: ${APP_TASK_REMINDER_ZONE:Asia/Shanghai}
    # 任务只有 due_date、没有 due_at 时，在截止日当天该时刻提醒（用户本地）
    default-due-date-reminder-time: ${APP_TASK_REMINDER_DEFAULT_TIME:08:00}
    debug-log-enabled: ${APP_TASK_REMINDER_DEBUG_LOG:true}
    debug-log-file: ${APP_TASK_REMINDER_DEBUG_LOG_FILE:logs/task-reminder.txt}
  # 成长计划 tasks：开始执行后按 estimated_minutes 自动完成；计划日次日标未完成（助手每日提醒仍走 task-reminder）
  growth-task:
    execution-enabled: ${APP_GROWTH_TASK_EXECUTION_ENABLED:true}
  # 陪伴记忆：周六 03:00 总结，周六 08:00（用户本地）与任务提醒一并推送本周回顾
  companion-memory:
    enabled: ${APP_COMPANION_MEMORY_ENABLED:true}
    summarize-cron: ${APP_COMPANION_MEMORY_SUMMARIZE_CRON:0 0 3 ? * SAT}
    zone: ${APP_COMPANION_MEMORY_ZONE:Asia/Shanghai}
    digest-delivery-time: ${APP_COMPANION_MEMORY_DIGEST_TIME:08:00}
    digest-in-app-enabled: ${APP_COMPANION_MEMORY_DIGEST_IN_APP:true}
    digest-push-enabled: ${APP_COMPANION_MEMORY_DIGEST_PUSH:true}
    max-messages-per-week: ${APP_COMPANION_MEMORY_MAX_MSG_PER_WEEK:200}
    max-memory-chars: ${APP_COMPANION_MEMORY_MAX_CHARS:12000}
  # 移动系统推送：默认 uni-push 2.0 云函数 URL（Firebase 在 DCloud 托管）；见 md文档/环境与密钥配置.md §3.5
  mobile-push:
    enabled: ${APP_MOBILE_PUSH_ENABLED:false}
    provider: ${APP_MOBILE_PUSH_PROVIDER:unipush}
    unipush-cloud-url: ${APP_UNIPUSH_CLOUD_URL:}
    unipush-http-secret: ${APP_UNIPUSH_HTTP_SECRET:}
    credentials-path: ${FCM_CREDENTIALS_PATH:}
    chat-reply-enabled: ${APP_MOBILE_PUSH_CHAT_REPLY:false}
  # 语音转写：前端 multipart → Java → 内网 STT（见 md文档/本地语音转写-STT部署.md）
  speech:
    enabled: ${APP_SPEECH_ENABLED:true}
    base-url: ${APP_SPEECH_BASE_URL:http://127.0.0.1:9000}
    transcribe-path: ${APP_SPEECH_TRANSCRIBE_PATH:/asr}
    upstream-file-part-name: ${APP_SPEECH_UPSTREAM_FILE_PART:audio_file}
    query-language: ${APP_SPEECH_QUERY_LANGUAGE:zh}
    query-output: ${APP_SPEECH_QUERY_OUTPUT:json}
    query-encode: ${APP_SPEECH_QUERY_ENCODE:true}
    query-task: ${APP_SPEECH_QUERY_TASK:transcribe}
    max-audio-bytes: ${APP_SPEECH_MAX_BYTES:10485760}
    connect-timeout-ms: ${APP_SPEECH_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${APP_SPEECH_READ_TIMEOUT_MS:120000}

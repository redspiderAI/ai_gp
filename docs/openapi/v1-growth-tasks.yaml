openapi: 3.0.3
info:
  title: AI 成长计划 API — 成长计划任务查询
  description: |
    按日查询 `tasks` 与 `user_assistant_tasks`。
    **标记完成**请用 `POST /api/v1/users/me/tasks/complete`（见 docs/openapi/v1-users.yaml）或对话内说明「XX 完成了」。
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: 成长计划任务
    security:
      - bearerAuth: []

security:
  - bearerAuth: []

paths:
  /api/v1/users/me/growth-tasks:
    get:
      tags: [成长计划任务]
      summary: 按日期查询成长计划任务
      description: |
        同时返回指定日期的成长计划 `tasks` 与助手待办 `assistantTasks`（规则同 `/today`）。
      operationId: listGrowthTasksByDate
      parameters:
        - name: date
          in: query
          required: false
          description: 计划执行日 yyyy-MM-dd（月日补零）。省略时按用户时区取「今天」，等同 `/today`。
          schema:
            type: string
            format: date
            example: "2026-05-22"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthTaskListResponse'
        '400':
          description: date 格式非法（须 yyyy-MM-dd）
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me/growth-tasks/today:
    get:
      tags: [成长计划任务]
      summary: 查询用户本地今天的计划任务
      description: |
        同时返回：
        - `tasks`：`tasks` 表，`scheduledDate` 为今天的成长计划任务；
        - `assistantTasks`：`user_assistant_tasks` 表，`due_date` 或 `due_at` 落在今天的助手待办。
      operationId: listGrowthTasksToday
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowthTaskListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    GrowthTaskItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        goalId:
          type: integer
          format: int64
        planId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        scheduledDate:
          type: string
          format: date
        estimatedMinutes:
          type: integer
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED, SKIPPED, INCOMPLETE]
        startedAt:
          type: string
          format: date-time
          nullable: true
        plannedEndAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        actualMinutes:
          type: integer
          nullable: true

    GrowthTaskListResponse:
      type: object
      properties:
        count:
          type: integer
          description: 成长计划 tasks 条数
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/GrowthTaskItemResponse'
        assistantCount:
          type: integer
          description: 助手待办条数（截止日为查询日）
        assistantTasks:
          type: array
          items:
            $ref: '#/components/schemas/UserAssistantTaskItemResponse'

    UserAssistantTaskItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [OPEN, DONE, CANCELLED]
        dueDate:
          type: string
          format: date
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        imageUrls:
          type: array
          items:
            type: string
        reminderSentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: 未登录
    NotFound:
      description: 任务不存在或非本人
